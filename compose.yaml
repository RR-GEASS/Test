services:
  app:
    build: .
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: "3000"
      SCI_DATA_DIR: /app/data
      SCI_TRUST_PROXY: "1"
    expose:
      - "3000"
    volumes:
      - sci_data:/app/data
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?Renseignez DOMAIN dans le fichier .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  sci_data:
  caddy_data:
  caddy_config:
